{% extends 'base.html' %}
{% block title %}Create Account — Air{% endblock %}

{% block content %}
<div class="min-h-screen bg-blue-50 flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">

        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="/" class="inline-flex flex-col items-center gap-2">
                <div class="w-14 h-14 rounded-2xl gradient-blue flex items-center justify-center shadow-lg">
                    <span class="text-white font-bold text-2xl">A</span>
                </div>
                <div>
                    <div class="font-bold text-2xl gradient-text">Air</div>
                    <div class="text-gray-400 text-sm">AI Reservations</div>
                </div>
            </a>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-1">Create your account</h1>
            <p class="text-gray-500 text-sm mb-6">Join Air — AI Reservations today</p>

            {% if error %}
            <div class="bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 mb-5 text-sm flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/auth/register" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Full Name</label>
                    <input type="text" name="name" required
                           class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent"
                           placeholder="Jane Smith">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
                    <input type="email" name="email" required
                           class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent"
                           placeholder="you@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                    <input type="password" name="password" required minlength="6"
                           class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent"
                           placeholder="At least 6 characters">
                </div>

                <!-- Role selection -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">I want to...</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="guest" class="sr-only peer" checked>
                            <div class="border-2 border-gray-200 peer-checked:border-blue-500 peer-checked:bg-blue-50 rounded-xl p-4 text-center transition-all">
                                <i data-lucide="search" class="w-6 h-6 mx-auto mb-1.5 text-gray-500 peer-checked:text-blue-600"></i>
                                <div class="font-semibold text-sm text-gray-800">Book as Guest</div>
                                <div class="text-gray-400 text-xs mt-0.5">Discover & book</div>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="host" class="sr-only peer">
                            <div class="border-2 border-gray-200 peer-checked:border-blue-500 peer-checked:bg-blue-50 rounded-xl p-4 text-center transition-all">
                                <i data-lucide="home" class="w-6 h-6 mx-auto mb-1.5 text-gray-500 peer-checked:text-blue-600"></i>
                                <div class="font-semibold text-sm text-gray-800">Host on Air</div>
                                <div class="text-gray-400 text-xs mt-0.5">List & earn</div>
                            </div>
                        </label>
                    </div>
                </div>

                <button type="submit"
                        class="w-full gradient-blue text-white font-semibold py-2.5 rounded-xl hover:opacity-90 transition-opacity mt-2">
                    Create Account
                </button>
            </form>

            <p class="text-center text-gray-500 text-sm mt-6">
                Already have an account?
                <a href="/auth/login" class="text-blue-600 font-medium hover:underline">Log in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
