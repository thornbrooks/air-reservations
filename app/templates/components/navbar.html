<nav class="sticky top-0 z-40 bg-white border-b border-line/70 shadow-[0_1px_0_rgba(0,0,0,0.04)]">
    <div class="max-w-[1480px] mx-auto px-5 sm:px-8">
        <div class="flex items-center justify-between h-[72px] gap-4">

            <!-- Brand -->
            <a href="/" class="flex items-center gap-2.5 flex-shrink-0 group">
                <span class="w-[34px] h-[34px] grid place-items-center flex-none rounded-[50%_50%_50%_8px] gradient-blue shadow-[0_2px_8px_rgba(232,148,0,0.5)] transition-transform group-hover:scale-105">
                    <span class="w-[11px] h-[11px] rounded-full bg-white"></span>
                </span>
                <span class="leading-tight">
                    <span class="block font-extrabold text-[22px] tracking-tight text-ink">Air</span>
                    <span class="block text-muted text-[11px] -mt-1.5 font-medium">AI Reservations</span>
                </span>
            </a>

            <!-- Collapsed search pill (center) -->
            <form action="/search" method="GET" class="hidden md:flex items-center bg-white border border-line rounded-full shadow-card hover:shadow-soft transition-shadow overflow-hidden">
                <input
                    type="text"
                    name="q"
                    value="{{ request.args.get('q', '') }}"
                    placeholder="Search homes, experiences, events…"
                    class="w-64 lg:w-80 pl-5 pr-3 py-2.5 text-sm font-medium text-ink placeholder-muted bg-transparent focus:outline-none">
                <button type="submit" aria-label="Search" class="m-1.5 w-9 h-9 rounded-full grid place-items-center gradient-blue text-white flex-none active:scale-95 transition-transform">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </button>
            </form>

            <!-- Right side -->
            <div class="flex items-center gap-1.5">
                <a href="/homes" class="px-3.5 py-2.5 rounded-full text-[14.5px] font-semibold text-ink hover:bg-soft transition-colors hidden lg:block">Homes</a>
                <a href="/experiences" class="px-3.5 py-2.5 rounded-full text-[14.5px] font-semibold text-ink hover:bg-soft transition-colors hidden lg:block">Experiences</a>
                <a href="/parties" class="px-3.5 py-2.5 rounded-full text-[14.5px] font-semibold text-ink hover:bg-soft transition-colors hidden lg:block">Events</a>
                <a href="/hotels/" class="px-3.5 py-2.5 rounded-full text-[14.5px] font-semibold text-ink hover:bg-soft transition-colors hidden lg:block">Hotels</a>

                {% if session.get('user_id') %}
                    <a href="/homes/create" class="px-3.5 py-2.5 rounded-full text-[14.5px] font-semibold text-ink hover:bg-soft transition-colors hidden xl:block">Become a host</a>
                    <!-- Profile pill -->
                    <div class="relative ml-1">
                        <button
                            onclick="this.nextElementSibling.classList.toggle('hidden')"
                            class="flex items-center gap-2.5 border border-line rounded-full pl-3.5 pr-2 py-1.5 hover:shadow-soft transition-shadow">
                            <span class="flex flex-col gap-[3px]">
                                <i class="w-[15px] h-[1.8px] bg-ink block"></i>
                                <i class="w-[15px] h-[1.8px] bg-ink block"></i>
                                <i class="w-[15px] h-[1.8px] bg-ink block"></i>
                            </span>
                            <span class="w-[30px] h-[30px] rounded-full bg-soft grid place-items-center text-muted">
                                <i data-lucide="user" class="w-4 h-4"></i>
                            </span>
                        </button>
                        <div class="hidden absolute right-0 mt-3 w-60 bg-white border border-line rounded-2xl shadow-float p-2 z-50">
                            <a href="/profile/" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-[14.5px] font-medium text-ink hover:bg-soft">
                                <i data-lucide="user" class="w-4 h-4"></i> Account
                            </a>
                            {% if session.get('role') == 'host' %}
                            <a href="/profile/my-listings" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-[14.5px] font-medium text-ink hover:bg-soft">
                                <i data-lucide="home" class="w-4 h-4"></i> My Listings
                            </a>
                            {% endif %}
                            <a href="/bookings/my-bookings" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-[14.5px] font-medium text-ink hover:bg-soft">
                                <i data-lucide="briefcase" class="w-4 h-4"></i> Trips
                            </a>
                            <a href="/homes/create" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-[14.5px] font-medium text-ink hover:bg-soft">
                                <i data-lucide="plus-circle" class="w-4 h-4"></i> List your place
                            </a>
                            <div class="h-px bg-line my-2"></div>
                            <a href="/auth/logout" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-[14.5px] font-medium text-ink hover:bg-soft">
                                <i data-lucide="log-out" class="w-4 h-4"></i> Log out
                            </a>
                        </div>
                    </div>
                {% else %}
                    <a href="#" class="px-3.5 py-2.5 rounded-full text-[14.5px] font-semibold text-ink hover:bg-soft transition-colors hidden md:block" aria-label="Language">
                        <i data-lucide="globe" class="w-[18px] h-[18px]"></i>
                    </a>
                    <!-- Guest profile pill -> auth -->
                    <div class="relative ml-1">
                        <button
                            onclick="this.nextElementSibling.classList.toggle('hidden')"
                            class="flex items-center gap-2.5 border border-line rounded-full pl-3.5 pr-2 py-1.5 hover:shadow-soft transition-shadow">
                            <span class="flex flex-col gap-[3px]">
                                <i class="w-[15px] h-[1.8px] bg-ink block"></i>
                                <i class="w-[15px] h-[1.8px] bg-ink block"></i>
                                <i class="w-[15px] h-[1.8px] bg-ink block"></i>
                            </span>
                            <span class="w-[30px] h-[30px] rounded-full bg-soft grid place-items-center text-muted">
                                <i data-lucide="user" class="w-4 h-4"></i>
                            </span>
                        </button>
                        <div class="hidden absolute right-0 mt-3 w-60 bg-white border border-line rounded-2xl shadow-float p-2 z-50">
                            <a href="/auth/register" class="block px-3 py-2.5 rounded-xl text-[14.5px] font-bold text-ink hover:bg-soft">Sign up</a>
                            <a href="/auth/login" class="block px-3 py-2.5 rounded-xl text-[14.5px] font-medium text-ink hover:bg-soft">Log in</a>
                            <div class="h-px bg-line my-2"></div>
                            <a href="/homes/create" class="block px-3 py-2.5 rounded-xl text-[14.5px] font-medium text-ink hover:bg-soft">Become a host</a>
                            <a href="/hotels/" class="block px-3 py-2.5 rounded-xl text-[14.5px] font-medium text-ink hover:bg-soft">Hotels</a>
                        </div>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
