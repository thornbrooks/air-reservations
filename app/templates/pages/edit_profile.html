{% extends 'base.html' %}
{% block title %}Edit Profile — Air{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900">Edit Profile</h1>
        <p class="text-gray-500 mt-1">Update your Air account details</p>
    </div>

    <div class="bg-white border border-gray-100 rounded-2xl shadow-sm p-8">
        <form method="POST" action="/profile/edit" enctype="multipart/form-data" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Profile image -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Profile Photo</label>
                <div class="flex items-center gap-4">
                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center flex-shrink-0 overflow-hidden">
                        {% if user and user.profile_image %}
                            <img src="{{ user.profile_image }}" alt="Profile" class="w-full h-full object-cover">
                        {% else %}
                            <span class="text-white text-xl font-bold">
                                {{ ((user.name or user.email or 'U')[0]|upper) if user else 'U' }}
                            </span>
                        {% endif %}
                    </div>
                    <label class="cursor-pointer border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
                        <span>Upload new photo</span>
                        <input type="file" name="profile_image" accept="image/*" class="sr-only">
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Full Name</label>
                <input type="text" name="name" value="{{ user.name if user else '' }}"
                       class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
                       placeholder="Your full name">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Phone Number</label>
                <input type="tel" name="phone" value="{{ user.phone if user else '' }}"
                       class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
                       placeholder="+1 (555) 000-0000">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Bio</label>
                <textarea name="bio" rows="4"
                          class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none"
                          placeholder="Tell guests and hosts a bit about yourself...">{{ user.bio if user else '' }}</textarea>
            </div>

            <div class="flex gap-3 pt-2">
                <button type="submit"
                        class="gradient-blue text-white font-semibold px-8 py-3 rounded-xl hover:opacity-90 transition-opacity">
                    Save Changes
                </button>
                <a href="/profile/"
                   class="border border-gray-300 text-gray-700 font-medium px-6 py-3 rounded-xl hover:bg-gray-50 transition-colors">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
